<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorSqlite</title>
    <base href="/" />
    <style>
        :root {
            --ink: #1c1917;
            --muted: #57534e;
            --line: #e7e5e4;
            --paper: #f4f1ea;
            --card: #fff;
            --accent: #0f766e;
            --accent-ink: #134e4a;
            --danger: #b91c1c;
            --warn: #a16207;
            --ok: #047857;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 400px at 10% -10%, #d1fae5 0%, transparent 50%),
                var(--paper);
            line-height: 1.5;
        }
        .shell { max-width: 92rem; margin: 0 auto; padding: 1.1rem 1.25rem 3.5rem; }
        .top {
            display: flex;
            justify-content: space-between;
            gap: 1.25rem;
            flex-wrap: wrap;
            align-items: end;
            padding-bottom: 0.9rem;
            border-bottom: 1px solid var(--line);
            margin-bottom: 0.85rem;
        }
        .eyebrow {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 700;
        }
        h1 { margin: 0.1rem 0 0; font-size: 1.4rem; font-weight: 650; letter-spacing: -0.02em; }
        h2 { margin: 0 0 0.35rem; font-size: 1.05rem; }
        h3 { margin: 0.9rem 0 0.3rem; font-size: 0.92rem; }
        p { margin: 0.35rem 0 0.7rem; color: var(--muted); }
        p.lead { color: var(--ink); font-size: 1.02rem; max-width: 52rem; }
        nav { display: flex; gap: 0.25rem; flex-wrap: wrap; }
        nav a {
            color: var(--ink);
            text-decoration: none;
            padding: 0.32rem 0.65rem;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 0.92rem;
        }
        nav a:hover { background: #fff; border-color: var(--line); }
        nav a.active { background: var(--ink); color: #fff; }
        .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
        .split { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr) 22rem; }
        @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
        .stack { display: grid; gap: 1rem; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 0.85rem;
            padding: 1rem 1.1rem 1.15rem;
            box-shadow: 0 1px 0 rgba(28, 25, 23, 0.04);
        }
        .note {
            background: #ecfdf5;
            border: 1px solid #99f6e4;
            color: var(--accent-ink);
            border-radius: 0.6rem;
            padding: 0.75rem 0.9rem;
            margin: 0 0 1rem;
        }
        .warn {
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #854d0e;
            border-radius: 0.6rem;
            padding: 0.75rem 0.9rem;
        }
        .error { color: var(--danger); margin: 0.5rem 0; }
        .storage-ok { color: var(--ok); margin: 0; font-size: 0.88rem; }
        form, .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 0.55rem 0; }
        form.stack-form { display: grid; gap: 0.55rem; margin: 0; }
        form.stack-form label { display: grid; gap: 0.15rem; font-size: 0.78rem; color: var(--muted); font-weight: 600; }
        input, button, select, textarea {
            font: inherit;
            padding: 0.4rem 0.6rem;
            border-radius: 0.4rem;
            border: 1px solid #d6d3d1;
            background: #fff;
        }
        textarea { min-height: 4.5rem; resize: vertical; }
        button {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
            cursor: pointer;
        }
        button.secondary { background: #fff; color: var(--ink); }
        button.danger { background: #fff; color: var(--danger); border-color: #fecaca; }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.42rem 0.45rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
        th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
        tr.selected td { background: #f0fdfa; }
        tr.clickable { cursor: pointer; }
        tr.clickable:hover td { background: #fafaf9; }
        .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 0 0 0.75rem; }
        .toolbar input[type="search"] { min-width: 14rem; }
        .grow { flex: 1; }
        .kpi { display: grid; gap: 0.15rem; }
        .kpi strong { font-size: 1.55rem; letter-spacing: -0.03em; }
        .kpi span { color: var(--muted); font-size: 0.82rem; }
        .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 0.8rem; }
        .swatch {
            display: inline-block;
            width: 0.7rem; height: 0.7rem;
            border-radius: 999px;
            vertical-align: -0.05rem;
            margin-right: 0.35rem;
            border: 1px solid rgba(0,0,0,0.08);
        }
        code, pre {
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
            font-size: 0.82rem;
        }
        pre {
            background: #1c1917;
            color: #f5f5f4;
            padding: 0.8rem;
            border-radius: 0.5rem;
            overflow: auto;
            white-space: pre-wrap;
        }
        ul.plain { margin: 0.4rem 0 0; padding-left: 1.1rem; color: var(--muted); }
        .pill {
            display: inline-block;
            border-radius: 999px;
            padding: 0.08rem 0.5rem;
            background: #ccfbf1;
            color: var(--accent-ink);
            font-size: 0.75rem;
            font-weight: 650;
        }
        .pill.warn { background: #fef3c7; color: #92400e; }
        .pill.danger { background: #fee2e2; color: #991b1b; }
        .pill.muted { background: #f5f5f4; color: var(--muted); }
        .pill.ok { background: #d1fae5; color: #065f46; }
        .storage-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            align-items: center;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 0.85rem;
            padding: 0.7rem 0.9rem;
            margin-bottom: 1.1rem;
        }
        .storage-now { display: flex; gap: 0.65rem; align-items: center; min-width: 11rem; }
        .storage-now p { margin: 0; }
        .storage-kicker { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
        .storage-name { font-weight: 650; color: var(--ink); }
        .storage-dot {
            width: 0.7rem; height: 0.7rem; border-radius: 999px; background: var(--accent);
            box-shadow: 0 0 0 4px #ccfbf1;
        }
        .storage-dot[data-name="indexeddb"] { background: #1d4ed8; box-shadow: 0 0 0 4px #dbeafe; }
        .storage-dot[data-name="cache-storage"] { background: #a16207; box-shadow: 0 0 0 4px #fef3c7; }
        .storage-dot[data-name="in-memory"] { background: #57534e; box-shadow: 0 0 0 4px #e7e5e4; }
        .storage-pick { display: grid; gap: 0.1rem; font-size: 0.72rem; color: var(--muted); font-weight: 650; }
        .storage-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .type-table td:first-child { white-space: nowrap; }
        .actions { display: flex; gap: 0.35rem; }
        .actions button { padding: 0.22rem 0.5rem; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="app">Opening SQLite in this tab…</div>
    <script src="sample.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
