    <meta name="description" content="EF Core on SQLite-WASM for Blazor WebAssembly. The same entities and migrations on the client as on the server, over OPFS, IndexedDB, Cache Storage, or memory." />

    <base href="/" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cellipse cx='16' cy='9' rx='9' ry='3.6' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M7 9v14c0 2 4 3.6 9 3.6s9-1.6 9-3.6V9' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M7 16c0 2 4 3.6 9 3.6s9-1.6 9-3.6' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3C/svg%3E" />

    <script>
        // Runs before first paint so the shell never flashes the wrong theme. The stored value is
        // a *preference* ("system" | "light" | "dark"); what lands on <html> is always the resolved
        // one, which is why the stylesheet needs a single [data-theme="dark"] block and no
        // duplicated prefers-color-scheme table.
        (function () {
            var KEY = "blazorsqlite.theme";
            var media = window.matchMedia("(prefers-color-scheme: dark)");

            function preference() {
                try {
                    var stored = localStorage.getItem(KEY);
                    return stored === "light" || stored === "dark" ? stored : "system";
                } catch (e) {
                    return "system"; // storage blocked: the system theme wins
                }
            }

            function apply() {
                var wanted = preference();
                var resolved = wanted === "system" ? (media.matches ? "dark" : "light") : wanted;
                document.documentElement.setAttribute("data-theme", resolved);
                return resolved;
            }

            apply();
            media.addEventListener("change", function () {
                if (preference() === "system") { apply(); }
            });

            window.__blazorSqliteTheme = { key: KEY, preference: preference, apply: apply };
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
