<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorSqlite</title>
    <base href="/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cellipse cx='16' cy='9' rx='9' ry='3.6' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M7 9v14c0 2 4 3.6 9 3.6s9-1.6 9-3.6V9' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M7 16c0 2 4 3.6 9 3.6s9-1.6 9-3.6' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3C/svg%3E" />
    <script>
        // Applied before first paint so the shell never flashes the wrong theme.
        (function () {
            try {
                var stored = localStorage.getItem("blazorsqlite.theme");
                if (stored === "light" || stored === "dark") {
                    document.documentElement.setAttribute("data-theme", stored);
                }
            } catch (e) { /* storage blocked: the system theme wins */ }
        })();
    </script>
    <style>
        :root {
            color-scheme: light;
            --ink: #1c1917;
            --muted: #57534e;
            --faint: #78716c;
            --line: #e7e5e4;
            --paper: #f4f1ea;
            --glow: #d1fae5;
            --card: #ffffff;
            --card-2: #fafaf9;
            --field: #ffffff;
            --field-line: #d6d3d1;
            --accent: #0f766e;
            --accent-ink: #134e4a;
            --accent-soft: #ccfbf1;
            --accent-wash: #ecfdf5;
            --danger: #b91c1c;
            --danger-soft: #fee2e2;
            --danger-line: #fecaca;
            --warn-ink: #854d0e;
            --warn-soft: #fef3c7;
            --warn-line: #fde68a;
            --warn-wash: #fffbeb;
            --ok: #047857;
            --ok-soft: #d1fae5;
            --ok-ink: #065f46;
            --shadow: 0 1px 0 rgba(28, 25, 23, 0.04);
            --shadow-lg: 0 8px 24px -12px rgba(28, 25, 23, 0.28);
            --code-bg: #f7f6f3;
            --code-head: #efedea;
            --code-line: #e2e0dc;
            --code-ink: #292524;
            --code-comment: #78716c;
            --code-keyword: #7c3aed;
            --code-string: #b45309;
            --code-number: #0369a1;
            --code-type: #0f766e;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --ink: #ede9e4;
            --muted: #a8a29e;
            --faint: #8b857f;
            --line: #2c2926;
            --paper: #14120f;
            --glow: #0b2f2a;
            --card: #1b1917;
            --card-2: #242120;
            --field: #14120f;
            --field-line: #3a3532;
            --accent: #2dd4bf;
            --accent-ink: #99f6e4;
            --accent-soft: #113b36;
            --accent-wash: #10312d;
            --danger: #f87171;
            --danger-soft: #40201f;
            --danger-line: #5c2b28;
            --warn-ink: #fbbf24;
            --warn-soft: #3a2c11;
            --warn-line: #4d3a15;
            --warn-wash: #2a2110;
            --ok: #34d399;
            --ok-soft: #123b30;
            --ok-ink: #6ee7b7;
            --shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 30px -14px rgba(0, 0, 0, 0.8);
            --code-bg: #121110;
            --code-head: #1c1a18;
            --code-line: #2c2926;
            --code-ink: #e7e5e4;
            --code-comment: #857f79;
            --code-keyword: #c4b5fd;
            --code-string: #fbbf24;
            --code-number: #7dd3fc;
            --code-type: #5eead4;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --ink: #ede9e4;
                --muted: #a8a29e;
                --faint: #8b857f;
                --line: #2c2926;
                --paper: #14120f;
                --glow: #0b2f2a;
                --card: #1b1917;
                --card-2: #242120;
                --field: #14120f;
                --field-line: #3a3532;
                --accent: #2dd4bf;
                --accent-ink: #99f6e4;
                --accent-soft: #113b36;
                --accent-wash: #10312d;
                --danger: #f87171;
                --danger-soft: #40201f;
                --danger-line: #5c2b28;
                --warn-ink: #fbbf24;
                --warn-soft: #3a2c11;
                --warn-line: #4d3a15;
                --warn-wash: #2a2110;
                --ok: #34d399;
                --ok-soft: #123b30;
                --ok-ink: #6ee7b7;
                --shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 10px 30px -14px rgba(0, 0, 0, 0.8);
                --code-bg: #121110;
                --code-head: #1c1a18;
                --code-line: #2c2926;
                --code-ink: #e7e5e4;
                --code-comment: #857f79;
                --code-keyword: #c4b5fd;
                --code-string: #fbbf24;
                --code-number: #7dd3fc;
                --code-type: #5eead4;
            }
        }

        * { box-sizing: border-box; }

        html { scrollbar-gutter: stable; }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 400px at 10% -10%, var(--glow) 0%, transparent 50%),
                var(--paper);
            background-attachment: fixed;
            line-height: 1.5;
        }

        .shell { max-width: 92rem; margin: 0 auto; padding: 1.1rem 1.25rem 4rem; }

        /* masthead */
        .top {
            display: flex;
            justify-content: space-between;
            gap: 1rem 1.25rem;
            flex-wrap: wrap;
            align-items: center;
            padding-bottom: 0.9rem;
            border-bottom: 1px solid var(--line);
            margin-bottom: 0.85rem;
        }
        .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: inherit; }
        .brand-mark {
            width: 2.1rem; height: 2.1rem; border-radius: 0.55rem;
            display: grid; place-items: center;
            background: var(--accent); color: #ffffff;
            font-weight: 800; font-size: 0.8rem; letter-spacing: -0.03em;
            box-shadow: var(--shadow-lg);
            flex: none;
        }
        :root[data-theme="dark"] .brand-mark { color: #052e2b; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .brand-mark { color: #052e2b; }
        }
        .eyebrow {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.66rem;
            color: var(--accent);
            font-weight: 700;
        }
        .brand .eyebrow { display: block; }
        .brand-title { display: block; font-size: 1.02rem; font-weight: 650; letter-spacing: -0.02em; }
        .top-right { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }

        nav { display: flex; gap: 0.15rem; flex-wrap: wrap; align-items: center; }
        nav a {
            color: var(--ink);
            text-decoration: none;
            padding: 0.32rem 0.6rem;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 0.88rem;
            white-space: nowrap;
        }
        nav a:hover { background: var(--card); border-color: var(--line); }
        nav a.active { background: var(--ink); color: var(--paper); }
        .nav-sep { width: 1px; height: 1.1rem; background: var(--line); margin: 0 0.3rem; }

        /* theme switch */
        .theme {
            display: inline-flex;
            gap: 0.1rem;
            padding: 0.15rem;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--card);
        }
        .theme button {
            background: transparent;
            border: 0;
            color: var(--muted);
            border-radius: 999px;
            padding: 0.25rem 0.5rem;
            font-size: 0.76rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
        }
        .theme button:hover { color: var(--ink); }
        .theme button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
        .theme svg { width: 0.85rem; height: 0.85rem; }

        /* page header */
        .page-head { margin: 0.2rem 0 1.1rem; max-width: 62rem; }
        .page-head h1 { margin: 0.15rem 0 0.2rem; font-size: 1.5rem; font-weight: 650; letter-spacing: -0.025em; }
        h2 { margin: 0 0 0.35rem; font-size: 1.05rem; }
        h3 { margin: 0.9rem 0 0.3rem; font-size: 0.92rem; }
        p { margin: 0.35rem 0 0.7rem; color: var(--muted); }
        p.lead { color: var(--ink); font-size: 1rem; max-width: 60rem; }
        a { color: var(--accent); }

        /* layout */
        .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
        .split { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr) 22rem; align-items: start; }
        @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
        .stack { display: grid; gap: 1rem; }
        .stack-lg { display: grid; gap: 1rem; margin-top: 1rem; }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 0.85rem;
            padding: 1rem 1.1rem 1.15rem;
            box-shadow: var(--shadow);
            min-width: 0;
        }
        .card-head { display: flex; gap: 0.55rem; align-items: baseline; flex-wrap: wrap; }
        .card-head h2 { margin: 0; }
        .card-step {
            font-size: 0.66rem; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--accent);
        }
        .try {
            display: flex; gap: 0.5rem; align-items: baseline;
            margin: 0.6rem 0 0.8rem;
            padding: 0.45rem 0.65rem;
            border-left: 2px solid var(--accent);
            background: var(--accent-wash);
            border-radius: 0 0.45rem 0.45rem 0;
            color: var(--accent-ink);
            font-size: 0.85rem;
        }
        .try b { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.66rem; flex: none; }
        .try code { background: transparent; border-color: var(--accent-soft); }

        .note {
            background: var(--accent-wash);
            border: 1px solid var(--accent-soft);
            color: var(--accent-ink);
            border-radius: 0.6rem;
            padding: 0.75rem 0.9rem;
            margin: 0 0 1rem;
        }
        .warn {
            background: var(--warn-wash);
            border: 1px solid var(--warn-line);
            color: var(--warn-ink);
            border-radius: 0.6rem;
            padding: 0.75rem 0.9rem;
        }
        .error { color: var(--danger); margin: 0.5rem 0; }
        .storage-ok { color: var(--ok); margin: 0; font-size: 0.88rem; }

        /* forms */
        form, .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 0.55rem 0; }
        form.stack-form { display: grid; gap: 0.55rem; margin: 0; }
        form.stack-form label { display: grid; gap: 0.15rem; font-size: 0.78rem; color: var(--muted); font-weight: 600; }
        input, button, select, textarea {
            font: inherit;
            padding: 0.4rem 0.6rem;
            border-radius: 0.4rem;
            border: 1px solid var(--field-line);
            background: var(--field);
            color: var(--ink);
        }
        input[type="checkbox"] { accent-color: var(--accent); }
        input[type="color"] { padding: 0.15rem; height: 2.15rem; }
        textarea { min-height: 4.5rem; resize: vertical; }
        ::placeholder { color: var(--faint); }
        button {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
            cursor: pointer;
        }
        button:hover:not(:disabled) { filter: brightness(1.15); }
        button.secondary { background: var(--card); color: var(--ink); border-color: var(--field-line); }
        button.danger { background: var(--card); color: var(--danger); border-color: var(--danger-line); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .scroll-x { overflow-x: auto; }
        th, td { text-align: left; padding: 0.42rem 0.45rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
        th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
        tbody tr:last-child td { border-bottom: 0; }
        tr.selected td { background: var(--accent-wash); }
        tr.clickable { cursor: pointer; }
        tr.clickable:hover td { background: var(--card-2); }
        .empty { color: var(--faint); font-style: italic; }

        .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 0 0 0.75rem; }
        .toolbar input[type="search"] { min-width: 14rem; }
        .grow { flex: 1; }
        .kpi { display: grid; gap: 0.15rem; }
        .kpi strong { font-size: 1.55rem; letter-spacing: -0.03em; }
        .kpi span { color: var(--muted); font-size: 0.82rem; }
        .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 0.8rem; }
        .swatch {
            display: inline-block;
            width: 0.7rem; height: 0.7rem;
            border-radius: 999px;
            vertical-align: -0.05rem;
            margin-right: 0.35rem;
            border: 1px solid rgba(120, 113, 108, 0.35);
        }

        code {
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
            font-size: 0.84em;
            background: var(--card-2);
            border: 1px solid var(--line);
            border-radius: 0.3rem;
            padding: 0.02em 0.32em;
        }

        /* code block */
        .codeblock {
            border: 1px solid var(--code-line);
            border-radius: 0.6rem;
            overflow: hidden;
            background: var(--code-bg);
            margin: 0.85rem 0 0;
        }
        .codeblock + .codeblock { margin-top: 0.6rem; }
        .codeblock-head {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.3rem 0.4rem 0.3rem 0.7rem;
            background: var(--code-head);
            border-bottom: 1px solid var(--code-line);
            font-size: 0.76rem;
        }
        .codeblock[data-open="false"] .codeblock-head { border-bottom: 0; }
        .codeblock-title {
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
            color: var(--ink);
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .codeblock-lang {
            text-transform: uppercase;
            letter-spacing: 0.07em;
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--accent);
            border: 1px solid var(--code-line);
            border-radius: 999px;
            padding: 0.08rem 0.4rem;
            flex: none;
        }
        .codeblock-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--muted);
            font-size: 0.73rem;
            padding: 0.2rem 0.45rem;
            border-radius: 0.35rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .codeblock-btn:hover { color: var(--ink); border-color: var(--code-line); background: var(--code-bg); }
        .codeblock-btn.copied { color: var(--ok); }
        .codeblock pre {
            margin: 0;
            padding: 0.75rem 0.85rem;
            overflow-x: auto;
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
            font-size: 0.79rem;
            line-height: 1.55;
            color: var(--code-ink);
            tab-size: 4;
        }
        .codeblock pre code {
            background: none; border: 0; padding: 0; font-size: inherit; color: inherit;
        }
        .tok-com { color: var(--code-comment); font-style: italic; }
        .tok-str { color: var(--code-string); }
        .tok-key { color: var(--code-keyword); font-weight: 600; }
        .tok-num { color: var(--code-number); }
        .tok-typ { color: var(--code-type); }

        /* runtime output panes reuse the code surface */
        pre.output {
            margin: 0.7rem 0 0;
            background: var(--code-bg);
            color: var(--code-ink);
            border: 1px solid var(--code-line);
            padding: 0.7rem 0.85rem;
            border-radius: 0.6rem;
            overflow-x: auto;
            white-space: pre-wrap;
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
            font-size: 0.79rem;
        }

        ul.plain { margin: 0.4rem 0 0; padding-left: 1.1rem; color: var(--muted); }
        ul.plain li { margin: 0.15rem 0; }

        .pill {
            display: inline-block;
            border-radius: 999px;
            padding: 0.08rem 0.5rem;
            background: var(--accent-soft);
            color: var(--accent-ink);
            font-size: 0.75rem;
            font-weight: 650;
        }
        .pill.warn { background: var(--warn-soft); color: var(--warn-ink); }
        .pill.danger { background: var(--danger-soft); color: var(--danger); }
        .pill.muted { background: var(--card-2); color: var(--muted); }
        .pill.ok { background: var(--ok-soft); color: var(--ok-ink); }

        /* storage bar */
        .storage-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 0.85rem;
            padding: 0.7rem 0.9rem;
            margin-bottom: 1.1rem;
            box-shadow: var(--shadow);
        }
        .storage-now { display: flex; gap: 0.65rem; align-items: center; min-width: 11rem; }
        .storage-now p { margin: 0; }
        .storage-kicker { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
        .storage-name { font-weight: 650; color: var(--ink); }
        .storage-blurb { font-size: 0.78rem; color: var(--faint); max-width: 30rem; flex: 1 1 16rem; }
        .storage-dot {
            display: inline-block;
            vertical-align: -0.05rem;
            margin-right: 0.15rem;
            width: 0.7rem; height: 0.7rem; border-radius: 999px; background: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
            flex: none;
        }
        .storage-dot[data-name="indexeddb"] { background: #3b82f6; box-shadow: 0 0 0 4px color-mix(in srgb, #3b82f6 28%, transparent); }
        .storage-dot[data-name="cache-storage"] { background: #d97706; box-shadow: 0 0 0 4px color-mix(in srgb, #d97706 28%, transparent); }
        .storage-dot[data-name="in-memory"] { background: #78716c; box-shadow: 0 0 0 4px color-mix(in srgb, #78716c 28%, transparent); }
        .storage-pick { display: grid; gap: 0.1rem; font-size: 0.72rem; color: var(--muted); font-weight: 650; }
        .storage-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .type-table td:first-child { white-space: nowrap; }
        .actions { display: flex; gap: 0.35rem; }
        .actions button { padding: 0.22rem 0.5rem; font-size: 0.8rem; }

        .loading { padding: 3rem 1.25rem; text-align: center; color: var(--muted); }
    </style>
</head>
<body>
    <div id="app"><div class="loading">Opening SQLite in this tab…</div></div>
    <script src="sample.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
